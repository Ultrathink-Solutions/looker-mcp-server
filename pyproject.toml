[project]
name = "looker-mcp-server"
version = "0.25.0"
description = "A Model Context Protocol (MCP) server for the Looker API with full tool coverage, OAuth pass-through, and user impersonation support."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ultrathink Solutions", email = "engineering@ultrathinksolutions.com" }]
keywords = ["mcp", "looker", "lookml", "bi", "model-context-protocol", "semantic-layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
readme = "README.md"
dependencies = [
    # FastMCP 4 runs on MCP SDK 2 and serves both protocol eras. The floor is
    # the latest FastMCP release that ships security fixes: 4.1.2 fixes
    # GHSA-7xgj-8392-5q4r and GHSA-vqqp-x5qm-5qp4, and it carries the earlier
    # 4.x fixes, among them GHSA-99xm-8q53-5c8p (4.1.0), which completes the
    # CVE-2026-32871 OpenAPI provider fix the 3.x floor was set for.
    "fastmcp>=4.1.2,<5",
    # Imported directly: mcp.types (per-revision result schemas for
    # /_introspect) and starlette (routes, middleware). Floors match FastMCP 4's.
    "mcp>=2.2,<3",
    "starlette>=1.0.1",
    # The Looker API client, JWKS fetch and token introspection use httpx;
    # none of these clients is handed to FastMCP or the MCP SDK (httpx2).
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "structlog>=24.0",
    # OIDC / OAuth 2.1 resource-server mode (LOOKER_MCP_MODE=public):
    # JWT decode + asymmetric key handling + JWKS fetching.
    "PyJWT[crypto]>=2.9",
    "cryptography>=42.0",
]

[project.scripts]
looker-mcp-server = "looker_mcp_server.main:cli"

[project.urls]
Homepage = "https://github.com/ultrathink-solutions/looker-mcp-server"
Repository = "https://github.com/ultrathink-solutions/looker-mcp-server"
Issues = "https://github.com/ultrathink-solutions/looker-mcp-server/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/looker_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["looker_mcp_server"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
